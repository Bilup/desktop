name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Yarn
        run: npm install -g yarn
      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_on: error
          command: yarn install --ignore-engines --ignore-scripts
      - name: Fetch
        run: yarn run fetch
      - name: Compile
        run: yarn run webpack:prod
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist-extensions/
            dist-library-files/
            dist-renderer-webpack/
            src-renderer/packager/
            dist-bilup-extensions/
  package-linux:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        format: [debian, tarball, appimage, pacman, rpm]
        arch: [x64, armv7l, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Yarn
        run: npm install -g yarn
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y strip-nondeterminism fakeroot ruby ruby-dev rubygems libarchive-tools rpm
          sudo gem install --no-document fpm
      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_on: error
          command: yarn install --ignore-engines --ignore-scripts
      - name: Package
        run: |
          node release-automation/build.mjs \
            --${{ matrix.format }} \
            --${{ matrix.arch }} \
            --production
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.format }}-${{ matrix.arch }}
          path: dist/*
  package-mac:
    needs: build
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: modern
            args: '--mac --universal'
          - target: legacy-10.13-10.14
            args: '--mac-legacy-10.13-10.14 --x64'
          - target: legacy-10.15
            args: '--mac-legacy-10.15 --x64'
          - target: legacy-11
            args: '--mac-legacy-11 --universal'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Yarn
        run: npm install -g yarn
      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_on: error
          command: yarn install --ignore-engines --ignore-scripts
      - name: Package
        run: node release-automation/build.mjs ${{ matrix.args }} --production
      - name: Rename DMG
        run: |
          DMG_FILE=$(find dist -name "*.dmg" | head -1)
          if [ -n "$DMG_FILE" ]; then
            NEW_NAME="Bilup-Setup-${{ matrix.target }}-${{ github.ref_name }}.dmg"
            mv "$DMG_FILE" "dist/$NEW_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.target }}
          path: dist/*.dmg
  package-windows:
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - target: modern-nsis-x64
            args: '--windows --x64'
            files: '*.exe'
          - target: modern-nsis-ia32
            args: '--windows --ia32'
            files: '*.exe'
          - target: modern-nsis-arm64
            args: '--windows --arm64'
            files: '*.exe'
          - target: modern-appx-x64
            args: '--microsoft-store --x64'
            files: '*.appx'
          - target: modern-appx-ia32
            args: '--microsoft-store --ia32'
            files: '*.appx'
          - target: modern-appx-arm64
            args: '--microsoft-store --arm64'
            files: '*.appx'
          - target: portable
            args: '--windows-portable --x64'
            files: '*.exe'
          - target: legacy-x64
            args: '--windows-legacy --x64'
            files: '*.exe'
          - target: legacy-ia32
            args: '--windows-legacy --ia32'
            files: '*.exe'
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
          path: repo
      - name: Move to D drive
        shell: pwsh
        run: |
          Copy-Item -Path repo -Destination D:\repo -Recurse
          Remove-Item -Path repo -Recurse -Force
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: D:\repo\
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Yarn
        run: npm install -g yarn
      - name: Configure yarn cache
        shell: pwsh
        run: |
          yarn config set cache-folder D:\yarn-cache
      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_on: error
          command: Set-Location D:\repo; yarn install --ignore-engines --ignore-scripts
      - name: Package
        working-directory: D:\repo
        run: |
          node release-automation/build.mjs ${{ matrix.args }} --production
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}
          path: D:\repo\dist\${{ matrix.files }}
          retention-days: 1
  publish:
    needs: [package-linux, package-mac, package-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload to GitHub Releases
        shell: bash
        run: |
          node scripts/upload-to-github-releases.mjs \
            "${{ github.repository_owner }}" \
            "${{ github.event.repository.name }}" \
            "artifacts/**/*.{exe,dmg,deb,tar.gz,AppImage,snap,rpm,zst}" \
            '^Bilup\.Portable\.\d+\.\d+\.\d+\.x64\.exe$'
        env:
          GH_TOKEN: "${{ github.token }}"
  sync-r2:
    needs: publish
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      BUCKET: bilup-desktop
    steps:
      - name: Checkout (for scripts)
        uses: actions/checkout@v4
      - name: Install tools
        run: |
          pip install awscli
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Configure AWS CLI
        run: |
          aws configure set aws_access_key_id ${{ secrets.R2_ACCESS_KEY }}
          aws configure set aws_secret_access_key ${{ secrets.R2_SECRET_KEY }}
          aws configure set default.region auto
      - name: Make r2 script executable
        run: chmod +x scripts/r2.sh
      - name: Get latest release tag
        id: latest
        run: |
          TAG=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r .tag_name)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $TAG"
      - name: Download release assets
        run: |
          mkdir download
          gh release download ${{ steps.latest.outputs.tag }} \
            --dir download \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Show downloaded files
        run: ls -R download
      - name: Update latest
        run: |
          ./scripts/r2.sh s3 rm s3://$BUCKET/ --recursive || true
          ./scripts/r2.sh s3 cp download/ s3://$BUCKET/ \
            --recursive